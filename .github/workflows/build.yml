name: Build app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Genera cartelle piattaforma
        run: flutter create . --project-name diario_atletica --org it.atletica --platforms=android,web
      - name: Fix compileSdk e Lint per plugin
        run: |
          if [ -f android/build.gradle.kts ]; then
            cat << 'EOF' >> android/build.gradle.kts

          subprojects {
              plugins.withId("com.android.library") {
                  extensions.configure<com.android.build.api.variant.LibraryAndroidComponentsExtension> {
                      finalizeDsl { ext ->
                          ext.compileSdk = 36
                          ext.lint.checkReleaseBuilds = false
                          ext.lint.abortOnError = false
                      }
                  }
              }
          }
          EOF
          elif [ -f android/build.gradle ]; then
            cat << 'EOF' >> android/build.gradle

          subprojects {
              plugins.withId("com.android.library") {
                  androidComponents {
                      finalizeDsl { ext ->
                          ext.compileSdk = 36
                          ext.lint {
                              checkReleaseBuilds false
                              abortOnError false
                          }
                      }
                  }
              }
          }
          EOF
          fi
      - name: Nome app Android
        run: sed -i 's/android:label="[^"]*"/android:label="Diario Atletica"/' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - name: Icona app
        run: dart run flutter_launcher_icons
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: diario-atletica-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Genera cartelle piattaforma
        run: flutter create . --project-name diario_atletica --org it.atletica --platforms=android,web
      - run: flutter pub get
      - name: Icona app
        run: dart run flutter_launcher_icons
      - name: Nome app web
        run: |
          sed -i 's/<title>[^<]*<\/title>/<title>Diario Atletica<\/title>/' web/index.html
          sed -i 's/content="diario_atletica"/content="Diario Atletica"/' web/index.html
          sed -i 's/"name": "[^"]*"/"name": "Diario Atletica"/; s/"short_name": "[^"]*"/"short_name": "Atletica"/' web/manifest.json
      - name: Build web
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy-web:
    needs: web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
